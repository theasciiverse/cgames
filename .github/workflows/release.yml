# Builds the cgames for the Asciiverse catalog, one title each (cmines,
# csokoban, cblocks): <game>-<target>.tar.gz (.zip on Windows), plus
# SHA256SUMS, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github"). Runs on our tags (*-av.*), or by hand for an
# existing tag.
#
# Built by asciiverse/Makefile with each game's curses interface. Linux
# builds run in Alpine and link ncurses statically, so the binaries carry
# the -musl triple av looks for first and need nothing on the player's
# machine. macOS links the system ncurses. Windows is cross-built with
# MinGW against PDCurses (wincon, wide and UTF-8, with the ncurses mouse
# calls).

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  PDCURSES_VERSION: "3.9"

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base ncurses-dev ncurses-static zip &&
            make -f asciiverse/Makefile LDFLAGS="-static -s" CURSES_LIBS="-lncursesw" &&
            asciiverse/package.sh ${{ matrix.target }}'
          file out/*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          make -f asciiverse/Makefile CFLAGS="-O2 -arch ${{ matrix.arch }}" \
            LDFLAGS="-arch ${{ matrix.arch }}" CURSES_LIBS=-lncurses
          strip out/*
          file out/*
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-pc-windows-gnu
      CROSS: x86_64-w64-mingw32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build PDCurses
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 zip
          curl -sL "https://github.com/wmcbrine/PDCurses/archive/refs/tags/$PDCURSES_VERSION.tar.gz" | tar xz -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/PDCurses-$PDCURSES_VERSION/wincon" CC=$CROSS-gcc AR=$CROSS-ar WIDE=Y UTF8=Y pdcurses.a

      - name: Build and package
        run: |
          PDC="$RUNNER_TEMP/PDCurses-$PDCURSES_VERSION"
          make -f asciiverse/Makefile CC=$CROSS-gcc EXE=.exe \
            CPPFLAGS="-I$PDC -DPDC_NCMOUSE -DPDC_WIDE -DPDC_FORCE_UTF8" \
            CURSES_LIBS="$PDC/wincon/pdcurses.a" LDFLAGS="-static -s"
          file out/*.exe
          asciiverse/package.sh $TARGET

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "cgames $TAG" \
                 --notes "cgames $TAG, Brian Raiter's cmines, csokoban (with David W. Skinner's levels) and cblocks, with the changes in PATCHES.md, built for the Asciiverse catalog: one archive per game."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
